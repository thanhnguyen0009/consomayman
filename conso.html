<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CON SỐ MAY MẮN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #f5f5f5;
      overflow: hidden;
      position: relative;
      background: #0f0c29;
    }

    /* Ảnh nền */
    .bg-image {
      position: fixed;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      z-index: 0;
    }

    /* Lớp phủ tối để chữ rõ hơn */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(15, 12, 41, 0.82), rgba(48, 43, 99, 0.78), rgba(36, 36, 62, 0.85));
      z-index: 1;
    }

    .container {
      text-align: center;
      padding: 50px 40px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(22px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #d4af37, #f5e6c8, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 40px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .number-display {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      position: relative;
    }

    .number {
      font-family: 'Playfair Display', serif;
      font-size: 5.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #d4af37 0%, #f8e9c0 50%, #c9a227 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: scale(0.6) translateY(20px);
      user-select: none;
    }

    .number.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .number.spinning {
      opacity: 1;
      transform: scale(1);
      animation: numberPulse 0.12s ease-in-out infinite alternate;
    }

    .number.hide {
      opacity: 0;
      transform: scale(0.7) translateY(-15px);
    }

    @keyframes numberPulse {
      from { transform: scale(0.97); filter: brightness(0.9); }
      to   { transform: scale(1.03); filter: brightness(1.15); }
    }

    .placeholder {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-generate {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #1a1a1a;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
    }

    .btn-generate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(212, 175, 55, 0.5);
    }

    .btn-generate:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-clear {
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-clear:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.35);
    }

    .btn-clear:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
    }

    button:focus:not(:active)::after {
      animation: ripple 0.6s ease-out;
    }

    @keyframes ripple {
      0% {
        transform: scale(0, 0);
        opacity: 0.5;
      }
      100% {
        transform: scale(40, 40);
        opacity: 0;
      }
    }

    /* ===== LỊCH SỬ SỐ ĐÃ QUAY ===== */
    .history {
      margin-top: 8px;
      text-align: left;
    }

    .history-title {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-height: 110px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.4);
      border-radius: 4px;
    }

    .history-item {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #f5e6c8;
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      min-width: 48px;
      text-align: center;
    }

    .history-empty {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.25);
      text-align: center;
      width: 100%;
    }

    /* ===== THÔNG BÁO LỚN ===== */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      background: linear-gradient(145deg, rgba(25, 20, 55, 0.97), rgba(40, 30, 80, 0.97));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #f5e6c8;
      padding: 40px 50px;
      border-radius: 24px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(212, 175, 55, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.3, 0.64, 1);
      z-index: 100;
      text-align: center;
      min-width: 320px;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .toast-title {
      font-size: 1.15rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    .toast-number {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 4.2rem;
      line-height: 1.1;
      background: linear-gradient(135deg, #d4af37 0%, #f8e9c0 50%, #c9a227 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      margin-bottom: 8px;
    }

    .toast-close {
      margin-top: 24px;
      background: linear-gradient(135deg, #d4af37, #b8860b);
      border: none;
      color: #1a1a1a;
      padding: 12px 36px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.3);
    }

    .toast-close:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(212, 175, 55, 0.45);
    }

    /* Lớp phủ tối phía sau thông báo */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s ease;
      z-index: 99;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 24px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .number {
        font-size: 4.2rem;
      }
      .buttons {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
      .toast {
        padding: 32px 28px;
        min-width: 280px;
      }
      .toast-number {
        font-size: 3.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ảnh nền -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="container">
    <h1>Số Ngẫu Nhiên</h1>
    <p class="subtitle"></p>

    <div class="number-display">
      <span class="placeholder" id="placeholder">Nhấn quay số</span>
      <span class="number" id="number"></span>
    </div>

    <div class="buttons">
      <button class="btn-generate" id="btnGenerate">Quay số mới</button>
      <button class="btn-clear" id="btnClear" disabled>Xóa số</button>
    </div>

    <!-- Lịch sử số đã quay -->
    <div class="history">
      <div class="history-title">Số đã quay</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">Chưa có số nào</div>
      </div>
    </div>
  </div>

  <!-- Lớp phủ tối -->
  <div class="overlay" id="overlay"></div>

  <!-- Thông báo lớn -->
  <div class="toast" id="toast">
    <div class="toast-title">Số may mắn của bạn là</div>
    <div class="toast-number" id="toastNumber">000</div>
    <button class="toast-close" id="toastClose">Đóng</button>
  </div>

  <script>
    const numberEl = document.getElementById('number');
    const placeholderEl = document.getElementById('placeholder');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnClear = document.getElementById('btnClear');
    const historyList = document.getElementById('historyList');
    const toast = document.getElementById('toast');
    const toastNumber = document.getElementById('toastNumber');
    const overlay = document.getElementById('overlay');
    const toastClose = document.getElementById('toastClose');

    // Danh sách số còn lại (1 → 1000)
    let availableNumbers = [];
    let drawnNumbers = []; // Số đã quay
    let currentNumber = null;
    let isSpinning = false;
    let spinInterval = null;
    let toastTimeout = null;

    // Khởi tạo danh sách
    function initNumbers() {
      availableNumbers = [];
      for (let i = 1; i <= 1300; i++) {
        availableNumbers.push(i);
      }
    }

    // Cập nhật lịch sử số đã quay
    function updateHistory() {
      if (drawnNumbers.length === 0) {
        historyList.innerHTML = '<div class="history-empty">Chưa có số nào</div>';
        return;
      }

      // Hiển thị số mới nhất ở đầu
      historyList.innerHTML = drawnNumbers
        .slice()
        .reverse()
        .map(num => `<div class="history-item">${num}</div>`)
        .join('');
    }

    // Lấy ngẫu nhiên 1 số từ danh sách còn lại và xóa nó
    function getRandomNumber() {
      if (availableNumbers.length === 0) return null;

      const index = Math.floor(Math.random() * availableNumbers.length);
      const number = availableNumbers[index];
      availableNumbers.splice(index, 1); // Xóa hẳn khỏi danh sách
      return number;
    }

    // Chỉ lấy số để hiện trong lúc quay (không xóa)
    function peekRandomNumber() {
      if (availableNumbers.length === 0) return 0;
      const index = Math.floor(Math.random() * availableNumbers.length);
      return availableNumbers[index];
    }

    function showToast(num) {
      if (toastTimeout) clearTimeout(toastTimeout);

      toastNumber.textContent = num;
      toast.classList.add('show');
      overlay.classList.add('show');

      toastTimeout = setTimeout(() => {
        hideToast();
      }, 5000);
    }

    function hideToast() {
      toast.classList.remove('show');
      overlay.classList.remove('show');
      if (toastTimeout) {
        clearTimeout(toastTimeout);
        toastTimeout = null;
      }
    }

    function startSpin() {
      if (isSpinning || availableNumbers.length === 0) return;

      isSpinning = true;
      btnGenerate.disabled = true;
      btnClear.disabled = true;

      hideToast();

      placeholderEl.style.display = 'none';

      numberEl.classList.remove('hide', 'show');
      numberEl.classList.add('spinning');
      numberEl.style.opacity = '1';
      numberEl.style.transform = 'scale(1)';

      // Quay nhanh bằng số còn lại (chỉ hiện, chưa xóa)
      spinInterval = setInterval(() => {
        numberEl.textContent = peekRandomNumber();
      }, 50);

      // Sau 2 giây thì dừng và lấy số thật (có xóa)
      setTimeout(() => {
        stopSpin();
      }, 2000);
    }

    function stopSpin() {
      clearInterval(spinInterval);
      spinInterval = null;

      currentNumber = getRandomNumber(); // Lấy + xóa khỏi danh sách

      if (currentNumber === null) {
        numberEl.textContent = '—';
        numberEl.classList.remove('spinning');
        isSpinning = false;
        btnGenerate.disabled = true;
        btnGenerate.textContent = 'Đã hết số';
        return;
      }

      // Thêm vào lịch sử
      drawnNumbers.push(currentNumber);
      updateHistory();

      numberEl.textContent = currentNumber;
      numberEl.classList.remove('spinning');
      numberEl.classList.add('show');

      isSpinning = false;
      btnGenerate.disabled = availableNumbers.length === 0;
      if (availableNumbers.length === 0) {
        btnGenerate.textContent = 'Đã hết số';
      }
      btnClear.disabled = false;

      // Hiện thông báo
      setTimeout(() => {
        showToast(currentNumber);
      }, 300);
    }

    function clearNumber() {
      if (currentNumber === null || isSpinning) return;

      numberEl.classList.remove('show');
      numberEl.classList.add('hide');

      hideToast();

      setTimeout(() => {
        numberEl.textContent = '';
        numberEl.classList.remove('hide');
        placeholderEl.style.display = 'block';
        currentNumber = null;
        btnClear.disabled = true;
      }, 350);
    }

    // Khởi tạo
    initNumbers();
    updateHistory();

    btnGenerate.addEventListener('click', startSpin);
    btnClear.addEventListener('click', clearNumber);
    toastClose.addEventListener('click', hideToast);
    overlay.addEventListener('click', hideToast);
  </script>
</body>
</html>
